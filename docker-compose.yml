services:
  db:
    image: postgres:16-alpine
    container_name: champions_club_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-champions_club}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-champions_club}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
